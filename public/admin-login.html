<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Panel Monitoring Rental & GPS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background Glows -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full bg-slate-800/90 backdrop-blur-xl rounded-3xl border border-slate-700 shadow-2xl p-8 relative z-10">
    
    <!-- Header Icon -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-blue-500/30 mb-3">
        <i class="fa-solid fa-satellite-dish"></i>
      </div>
      <h1 class="text-2xl font-black text-white">Panel Admin Rental</h1>
      <p class="text-xs text-slate-400 mt-1">Sistem Kontrol Kendaraan & Pelacak GPS Peta</p>
    </div>

    <!-- Alert Message -->
    <div id="alertBox" class="hidden mb-5 p-3 rounded-xl text-xs font-semibold"></div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
          Username Admin
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fa-solid fa-user text-xs"></i>
          </span>
          <input type="text" id="username" name="username" value="admin" required class="w-full pl-9 pr-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
          Kata Sandi (Password)
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fa-solid fa-lock text-xs"></i>
          </span>
          <input type="password" id="password" name="password" value="admin123" required class="w-full pl-9 pr-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <!-- Quick Hint -->
      <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/60 text-xs text-slate-400 flex items-center justify-between">
        <span>Akun Demo: <b class="text-blue-400 font-mono">admin</b> / <b class="text-blue-400 font-mono">admin123</b></span>
        <button type="button" onclick="fillDemo()" class="text-[11px] text-blue-400 hover:underline font-bold">Isi Otomatis</button>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="loginBtn" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 mt-2">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Masuk ke Dashboard</span>
      </button>

      <div class="text-center pt-3 border-t border-slate-700">
        <a href="/" class="text-xs text-slate-400 hover:text-slate-200 transition-colors">
          <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Halaman Utama
        </a>
      </div>
    </form>
  </div>

  <script>
    function fillDemo() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const alertBox = document.getElementById('alertBox');
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Memverifikasi...';
      alertBox.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success) {
          alertBox.className = 'mb-5 p-3 rounded-xl text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 block';
          alertBox.innerText = 'Login berhasil! Mengalihkan ke dashboard...';
          setTimeout(() => {
            window.location.href = '/admin-dashboard.html';
          }, 600);
        } else {
          alertBox.className = 'mb-5 p-3 rounded-xl text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/40 block';
          alertBox.innerText = data.message || 'Login gagal';
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk ke Dashboard';
        }
      } catch (err) {
        alertBox.className = 'mb-5 p-3 rounded-xl text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/40 block';
        alertBox.innerText = 'Terjadi kesalahan jaringan atau server.';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk ke Dashboard';
      }
    });
  </script>
</body>
</html>
